name: Probe iHatePosting OAuth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-oauth.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          for u in https://ihateposting.com/.well-known/oauth-protected-resource https://ihateposting.com/.well-known/oauth-protected-resource/mcp https://ihateposting.com/.well-known/oauth-protected-resource/mcp/oauth https://ihateposting.com/.well-known/oauth-authorization-server https://ihateposting.com/.well-known/openid-configuration; do
            echo "=== GET $u" >> probe.txt; curl -sS -i -m 20 "$u" | head -c 4000 >> probe.txt; echo >> probe.txt; done
          for u in https://ihateposting.com/mcp https://ihateposting.com/mcp/oauth; do
            echo "=== POST $u (no auth)" >> probe.txt
            curl -sS -i -m 20 -X POST "$u" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"probe","version":"1"}}}' | head -c 3000 >> probe.txt; echo >> probe.txt; done
          git init -q -b probe; git config user.name a; git config user.email a@b.c; git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
